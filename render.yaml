# Render Blueprint: despliega backend + frontend y crea PostgreSQL
# https://render.com/docs/blueprint-spec
# Después de conectar el repo, en Dashboard crea la BD y en el Web Service añade DATABASE_URL (Internal Database URL).

services:
  - type: web
    name: wms-app
    runtime: node
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install"
    startCommand: "cd backend && node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wms-db
          property: connectionString

databases:
  - name: wms-db
    databaseName: wms_db
    plan: free
    region: oregon
